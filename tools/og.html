<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=DM+Mono:wght@400;500&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#EDEDE6; color:#14181C; position:relative;
    font-family:"Archivo",sans-serif;
  }
  #field{position:absolute;inset:0;width:1200px;height:630px;z-index:0}
  .wrap{
    position:relative; z-index:1; width:100%; height:100%;
    padding:64px 72px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{display:flex;align-items:center;gap:14px}
  .mark{width:44px;height:44px;color:#1F3FC4;flex:none}
  .mark svg{width:100%;height:100%;display:block}
  .org{
    font-family:"DM Mono",monospace; font-size:19px; letter-spacing:.20em;
    text-transform:uppercase; color:#14181C;
  }
  h1{
    font-weight:800; font-variation-settings:"wdth" 123;
    font-size:118px; line-height:.85; letter-spacing:-.035em;
    text-transform:uppercase;
  }
  h1 em{font-style:normal;color:#1F3FC4}
  .rule{height:9px;background:#C8DB1F;width:220px;margin:28px 0 0}
  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .url{
    font-family:"DM Mono",monospace; font-size:25px; letter-spacing:.04em;
    color:#14181C;
  }
  .tag{
    font-family:"DM Mono",monospace; font-size:17px; letter-spacing:.15em;
    text-transform:uppercase; color:#5A6068; text-align:right; line-height:1.7;
  }
  .pill{
    display:inline-block; background:#F5386F; color:#241014;
    font-family:"DM Mono",monospace; font-size:16px; letter-spacing:.16em;
    text-transform:uppercase; padding:7px 14px; margin-bottom:18px;
  }
</style></head>
<body>
<canvas id="field" width="400" height="210"></canvas>
<div class="wrap">
  <div class="top">
    <span class="mark"><svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2.2"/>
      <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="currentColor" stroke-width="2.2"/>
      <ellipse cx="16" cy="16" rx="5.5" ry="14" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="16" cy="16" r="3.2" fill="#F5386F"/></svg></span>
    <span class="org">Pennridge STEM Initiative</span>
  </div>

  <div>
    <span class="pill">Science Fair &middot; All Grades</span>
    <h1>Every<br><em>Hypothesis</em><br>Starts Here</h1>
    <div class="rule"></div>
  </div>

  <div class="bottom">
    <span class="url">pennridgestem.org</span>
    <span class="tag">Elementary &middot; Middle &middot; High School<br>Pennridge School District</span>
  </div>
</div>

<script>
// the site's own two-source interference field, rendered once
(function(){
  var c=document.getElementById("field"), x=c.getContext("2d");
  var gw=c.width, gh=c.height, img=x.createImageData(gw,gh), d=img.data, i=0;
  var paper=[237,237,230], blue=[31,63,196], pink=[245,56,111];
  var s0x=gw*0.30, s0y=gh*0.34, s1x=gw*0.74, s1y=gh*0.72;
  var k=0.40, decay=0.019, t=0.9;
  for(var y=0;y<gh;y++){
    for(var xx=0;xx<gw;xx++){
      var dx=xx-s0x, dy=y-s0y, r0=Math.sqrt(dx*dx+dy*dy)+4;
      dx=xx-s1x; dy=y-s1y; var r1=Math.sqrt(dx*dx+dy*dy)+4;
      var a=(Math.sin(k*r0-t)*Math.exp(-decay*r0)+Math.sin(k*r1-t)*Math.exp(-decay*r1))*0.5;
      var w=Math.min(1,Math.abs(a))*0.30, tint=a>0?pink:blue;
      d[i++]=paper[0]+(tint[0]-paper[0])*w;
      d[i++]=paper[1]+(tint[1]-paper[1])*w;
      d[i++]=paper[2]+(tint[2]-paper[2])*w;
      d[i++]=255;
    }
  }
  x.putImageData(img,0,0);
})();
</script>
</body></html>
